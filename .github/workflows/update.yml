name: Veriyi güncelle

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Veriyi çek
        run: python scripts/fetch.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "mac-rehberi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Veri güncellendi: $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
            git push
          fi
